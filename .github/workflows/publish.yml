name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scots-codes
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish
